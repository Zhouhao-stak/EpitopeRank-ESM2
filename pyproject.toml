[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epitoperank"
dynamic = ["version"]
description = "AI-driven alternative splicing analysis and splice-neoantigen candidate platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Zhouhao-stak" }]
keywords = ["alternative-splicing", "neoantigen", "rmats", "mhc", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

# 与 requirements.txt 保持一致的下界。两处同时维护：requirements.txt 供
# `pip install -r` 直接使用（含桌面/打包专用项），这里供 `pip install .` 使用。
dependencies = [
    # multi-agent runtime (BioGAIP lineage)
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    # data layer
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    # visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
    # knowledge / RAG（缺失时优雅降级）
    "pymed>=0.8",
    # persistence
    "SQLAlchemy>=2.0",
    # report
    "reportlab>=4.0",
    "pypdf>=5.0",
    # interfaces
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pywebview>=6.2,<7; sys_platform == 'win32'",
    # MCP
    "mcp>=1.0.0",
    "httpx>=0.27",
    # optional agent backends（运行时探测，缺失则回退内置实现）
    "gseapy>=1.1",
    "mygene>=3.2",
    "bioservices>=1.11",
    # config
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "xlwt>=1.3",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.5",
]

[project.scripts]
# run.py 目前放在仓库根目录（不是包内模块），通过 py-modules 一起安装。
epitoperank = "run:main"

[project.urls]
Homepage = "https://github.com/Zhouhao-stak/EpitopeRank"
Documentation = "https://github.com/Zhouhao-stak/EpitopeRank/blob/epitoperank/docs/README.md"

[tool.setuptools]
include-package-data = true
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["epitoperank*"]

[tool.setuptools.dynamic]
version = { attr = "epitoperank.__version__" }

[tool.setuptools.package-data]
# 参考表与前端资源不是 .py，必须显式声明，否则装完包会缺文件
"epitoperank.interface" = ["*.js", "*.txt"]
"epitoperank.peptide" = ["reference/*.tsv", "reference/*.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

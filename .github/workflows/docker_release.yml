name: Docker image to GHCR

# 构建并发布本仓库根目录 Dockerfile 的镜像。
# 原来的 docker_release.yml 引用 bioGen/docker/bio_ag 与 bioGen/docker/bioWorker
# （BioGAIP 时期遗留，本仓库不存在这些路径），每次推 v* tag 都会失败。
#
# 触发：
#   1. 推送 v* tag → 构建并推送 :<tag> 与 :latest
#   2. 手动 Run workflow → 只构建验证，不推送
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # tag 推送才真正推镜像；手动触发只验证镜像能构建出来
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub 运行器在海外，覆盖掉 Dockerfile 里默认的国内 pip 镜像
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

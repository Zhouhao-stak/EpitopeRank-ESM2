name: Tests

# 触发分支必须显式包含默认分支 epitoperank，否则日常开发提交完全不进 CI。
# 历史上本文件只监听 master/main/develop，而仓库默认分支已切到 epitoperank，
# 导致 v1.4.x 的 20 个提交从未被测试过。
on:
  push:
    branches: [epitoperank, master, main, develop]
  pull_request:
    branches: [epitoperank, master, main, develop]
  workflow_dispatch:

# 同一分支的新推送会取消上一轮未完成的运行，节省额度
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 快速失败守卫：包内存在大量跨模块 import，语法或符号错误会在启动时才炸。
      # 先做一次真实导入，避免把问题拖到集成测试末期才暴露。
      - name: Import smoke check
        run: |
          python -c "import epitoperank; from epitoperank.api.app import create_app; create_app(); print('app factory OK')"

      - name: Run test suite with coverage
        run: |
          pytest tests/unit tests/integration tests/e2e -v \
            --cov=epitoperank --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=55

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy

      # 阻断项：只保留能证明代码真坏了的规则（语法错误、未定义名、重复定义等）。
      # 当前全仓 0 命中，因此它是可靠的回归护栏，不再是永远绿的装饰。
      - name: "Flake8 (blocking - real errors only)"
        run: |
          flake8 epitoperank/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      # 以下两项当前尚不达标（black 约 130 个文件待格式化、mypy 未收敛），
      # 因此显式标记为 advisory：失败不阻断合并，但报错会完整出现在日志里，
      # 不再用 `|| echo` / `|| true` 把真实问题吞掉。
      - name: Black formatting (advisory)
        continue-on-error: true
        run: |
          black --check --diff epitoperank/ tests/

      - name: MyPy type checking (advisory)
        continue-on-error: true
        run: |
          mypy epitoperank/ --ignore-missing-imports
